# Render(render.com) 배포 설정: GitHub 저장소를 연결하면 이 파일을 읽어 자동으로 만듭니다.
services:
  - type: web
    name: polaris
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # AI 설명 문장을 쓰려면 Render 화면에서 ANTHROPIC_API_KEY를 직접 입력하세요 (없으면 기본 문장으로 동작)
      - key: ANTHROPIC_API_KEY
        sync: false
