services:
  - type: web
    name: polaris
    runtime: python
    plan: free
    buildCommand: |
      SRC=$(dirname "$(dirname "$(find . -path '*36*' -path '*templates*' -name index.html | head -1)")")
      echo "SRC=$SRC"
      cp -r "$SRC"/. .
      pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ANTHROPIC_API_KEY
        sync: false
